name: Build and publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '44 11 * * 3'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test source normalization and coverage
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Build the static application
        run: |
          if test -f requirements.txt; then
            python3 -m venv "$RUNNER_TEMP/app-venv"
            . "$RUNNER_TEMP/app-venv/bin/activate"
            python3 -m pip install -r requirements.txt
          fi
          python3 scripts/build.py
          test -s dist/index.html
      - name: Install browser test dependencies
        run: python3 -m pip install -r tests/browser-requirements.txt
      - name: Check all geographic comparisons in a browser
        run: CHROMIUM_PATH="$(command -v google-chrome)" python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
